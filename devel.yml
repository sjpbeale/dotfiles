# This playbook is for getting things which
# are used for the development.
---
- name: Development root setup
  hosts: localhost
  become: yes
  pre_tasks:

    - name: Install development packages
      include_role:
        name: tools
        tasks_from: rpm
      vars:
        rpms: "{{ devel_packages }}"

    - name: Start MariaDB service
      service: name=mariadb state=started enabled=true

  roles:
    - role: geerlingguy.composer
    - role: andrewrothstein.terraform
    - role: geerlingguy.redis
    - role: geerlingguy.memcached
    - role: sjpbeale.mongodb
      mongodb_version: 3.2
    - role: sjpbeale.virtualbox

- name: Development user setup
  hosts: localhost

  roles: 
    - role: stephdewit.nvm
      nvm_version: 'latest'
      nvm_node_version: 'lts'
      nvm_install_deps: false
      nvm_shell_init_file: '~/.bashrc'
